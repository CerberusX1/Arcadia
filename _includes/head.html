
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1">

{% assign page_title = page.title | default: site.title %}
<title>{{ page_title }} | {{ site.title }}</title>

<meta name="description" content="{{ page.description | default: site.description | strip_html | normalize_whitespace | escape }}">
<meta name="theme-color" content="#101510">

<meta property="og:type" content="website">
<meta property="og:title" content="{{ page_title }} | {{ site.title }}">
<meta property="og:description" content="{{ page.description | default: site.description | strip_html | normalize_whitespace | escape }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">

<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
