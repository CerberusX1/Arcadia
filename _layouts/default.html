<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en-US' }}">
<head>
  <meta charset="UTF-8">
  {% seo %}
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
</head>
<body>
  <div class="wrapper">
    <header>
      <h1><a href="{{ '/' | relative_url }}">{{ site.title }}</a></h1>
      <p>{{ site.description }}</p>

      <nav>
        <ul>
          <li><a href="{{ '/' | relative_url }}">Home</a></li>
          <li><a href="{{ '/about/' | relative_url }}">About</a></li>
          <li><a href="{{ '/modlists/' | relative_url }}">Modlists</a></li>
          <li><a href="{{ '/guides/' | relative_url }}">Guides</a></li>
          <li><a href="{{ '/community/' | relative_url }}">Community</a></li>
          <li><a href="{{ '/support/' | relative_url }}">Support</a></li>
          <li><a href="https://discord.gg/3UaP8ssBSv">Discord</a></li>
        </ul>
      </nav>
    </header>

    <section>
      {{ content }}
    </section>

    <footer>
      <p>&copy; {{ 'now' | date: '%Y' }} Arcadia. A community built around immersive gaming and modding.</p>
    </footer>
  </div>
</body>
</html>
